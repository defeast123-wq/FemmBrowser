<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>FemmBrowser</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}


/* ============================= */
/* TABS */
/* ============================= */

#tabs {
    height: 42px;

    display: flex;
    align-items: center;

    gap: 5px;

    padding: 4px 6px 0;

    background: #080808;

    border-bottom: 1px solid #1c1c1c;
}

.tab {

    height: 36px;

    min-width: 150px;
    max-width: 230px;

    padding: 0 12px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: #111;

    border: 1px solid #222;

    border-radius: 9px 9px 0 0;

    cursor: pointer;

    user-select: none;

    transition: 0.2s;
}

.tab:hover {
    background: #181818;
}

.tab.active {
    background: #191919;
    border-color: #333;
}

.tab-title {
    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 13px;
}

.close {
    margin-left: 10px;

    opacity: 0.6;

    font-size: 15px;

    cursor: pointer;
}

.close:hover {
    opacity: 1;
}


/* ============================= */
/* NEW TAB */
/* ============================= */

#newTab {

    width: 34px;
    height: 34px;

    border: none;

    background: transparent;

    color: white;

    font-size: 23px;

    cursor: pointer;

    border-radius: 50%;
}

#newTab:hover {
    background: #1a1a1a;
}


/* ============================= */
/* TOOLBAR */
/* ============================= */

#toolbar {

    height: 58px;

    display: flex;
    align-items: center;

    gap: 8px;

    padding: 8px 10px;

    background: #080808;

    border-bottom: 1px solid #1c1c1c;
}


/* ============================= */
/* TOOL BUTTONS */
/* ============================= */

.toolButton {

    width: 38px;
    height: 38px;

    border: none;

    background: #111;

    color: white;

    border-radius: 50%;

    font-size: 18px;

    cursor: pointer;

    transition:
        background 0.15s,
        transform 0.15s;
}

.toolButton:hover {

    background: #202020;

    transform: scale(1.05);
}


/* ============================= */
/* ADDRESS BAR */
/* ============================= */

#url {

    flex: 1;

    height: 40px;

    background: #111;

    border: 1px solid #292929;

    border-radius: 22px;

    color: white;

    outline: none;

    padding: 0 18px;

    font-size: 14px;

    min-width: 100px;

    transition:
        border-color 0.2s,
        background 0.2s;
}

#url:focus {

    border-color: #555;

    background: #151515;
}


/* ============================= */
/* HOME BUTTON */
/* ============================= */

#homeBtn {

    width: 38px;
    height: 38px;

    border: none;

    background: #111;

    color: white;

    border-radius: 50%;

    cursor: pointer;

    font-size: 18px;

    transition:
        background 0.15s,
        transform 0.15s;
}

#homeBtn:hover {

    background: #202020;

    transform: scale(1.05);
}


/* ============================= */
/* FULLSCREEN */
/* ============================= */

#fullscreen {

    width: 38px;
    height: 38px;

    border: none;

    background: #111;

    color: white;

    border-radius: 50%;

    cursor: pointer;

    font-size: 16px;

    transition:
        background 0.15s,
        transform 0.15s;
}

#fullscreen:hover {

    background: #202020;

    transform: scale(1.05);
}

</style>

</head>


<body>


<!-- ================================= -->
<!-- TABS -->
<!-- ================================= -->

<div id="tabs">

    <button id="newTab">
        +
    </button>

</div>


<!-- ================================= -->
<!-- TOOLBAR -->
<!-- ================================= -->

<div id="toolbar">

    <button
        class="toolButton"
        id="back"
        title="Back"
    >
        ‹
    </button>


    <button
        class="toolButton"
        id="forward"
        title="Forward"
    >
        ›
    </button>


    <button
        class="toolButton"
        id="reload"
        title="Reload"
    >
        ↻
    </button>


    <button
        id="homeBtn"
        title="Home"
    >
        ⌂
    </button>


    <input
        id="url"
        type="text"
        value="FemmBrowser"
        placeholder="FemmBrowser"
        autocomplete="off"
        spellcheck="false"
    >


    <button
        id="fullscreen"
        title="Fullscreen"
    >
        ⛶
    </button>

</div>


<script>


// ========================================
// ELEMENTS
// ========================================

const tabsContainer =
    document.getElementById("tabs");

const newTabButton =
    document.getElementById("newTab");

const urlBox =
    document.getElementById("url");


// ========================================
// NEW TAB
// ========================================

newTabButton.addEventListener(
    "click",
    () => {

        window.femm.newTab();

    }
);


// ========================================
// BACK
// ========================================

document
    .getElementById("back")
    .addEventListener(
        "click",
        () => {

            window.femm.back();

        }
    );


// ========================================
// FORWARD
// ========================================

document
    .getElementById("forward")
    .addEventListener(
        "click",
        () => {

            window.femm.forward();

        }
    );


// ========================================
// RELOAD
// ========================================

document
    .getElementById("reload")
    .addEventListener(
        "click",
        () => {

            window.femm.reload();

        }
    );


// ========================================
// HOME
// ========================================

document
    .getElementById("homeBtn")
    .addEventListener(
        "click",
        () => {

            window.femm.home();

        }
    );


// ========================================
// FULLSCREEN
// ========================================

document
    .getElementById("fullscreen")
    .addEventListener(
        "click",
        () => {

            window.femm.fullscreen();

        }
    );


// ========================================
// SEARCH / NAVIGATE
// ========================================

function submitAddress() {

    const value =
        urlBox.value.trim();

    if (!value)
        return;


    // Send whatever was typed
    // to main.js.
    window.femm.navigate(value);

}


// ========================================
// ENTER KEY
// ========================================

urlBox.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            event.preventDefault();

            submitAddress();

        }

    }
);


// ========================================
// FOCUS ADDRESS BAR
// ========================================

urlBox.addEventListener(
    "focus",
    () => {

        setTimeout(() => {
            urlBox.select();
        }, 0);

    }
);


// ========================================
// TABS
// ========================================

window.femm.onTabs(
    tabs => {

        tabsContainer.innerHTML = "";


        for (const tab of tabs) {

            const tabElement =
                document.createElement("div");

            tabElement.className =
                "tab" +
                (
                    tab.active
                        ? " active"
                        : ""
                );


            const title =
                document.createElement("span");

            title.className =
                "tab-title";

            title.textContent =
                "FemmBrowser";


            const close =
                document.createElement("span");

            close.className =
                "close";

            close.textContent =
                "×";


            tabElement.appendChild(title);

            tabElement.appendChild(close);


            tabElement.addEventListener(
                "click",
                event => {

                    if (
                        event.target ===
                        close
                    ) {

                        window.femm.closeTab(
                            tab.id
                        );

                        return;

                    }

                    window.femm.switchTab(
                        tab.id
                    );

                }
            );


            tabsContainer.appendChild(
                tabElement
            );

        }


        tabsContainer.appendChild(
            newTabButton
        );

    }
);


// ========================================
// BROWSER STATE
// ========================================

window.femm.onState(
    () => {

        // Always show FemmBrowser.
        // Never replace it with DuckDuckGo.

        if (
            document.activeElement !==
            urlBox
        ) {

            urlBox.value =
                "FemmBrowser";

        }

    }
);


// ========================================
// START
// ========================================

urlBox.value =
    "FemmBrowser";


</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Femm Search</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #050505;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}


/* ============================= */
/* BACKGROUND */
/* ============================= */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.glow {
    position: absolute;
    width: 700px;
    height: 700px;
    left: 50%;
    top: 40%;
    transform: translate(-50%, -50%);
    background: radial-gradient(
        circle,
        rgba(255,255,255,0.07),
        rgba(255,255,255,0.025) 30%,
        transparent 70%
    );
    filter: blur(30px);
}


/* ============================= */
/* MAIN */
/* ============================= */

.main {
    position: relative;
    z-index: 2;

    min-height: 100vh;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    padding: 30px;
}


/* ============================= */
/* LOGO */
/* ============================= */

.logo {
    font-size: 70px;
    font-weight: 800;
    letter-spacing: -5px;
    margin-bottom: 12px;

    user-select: none;
}

.subtitle {
    color: #8a8a8a;
    font-size: 15px;
    margin-bottom: 35px;
}


/* ============================= */
/* SEARCH BOX */
/* ============================= */

.search-wrapper {
    width: min(720px, 90vw);
}

.search-box {
    width: 100%;
    height: 64px;

    display: flex;
    align-items: center;

    padding: 0 10px 0 22px;

    border: 1px solid #292929;
    border-radius: 32px;

    background: rgba(18,18,18,0.88);

    box-shadow:
        0 20px 60px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.03);

    backdrop-filter: blur(20px);

    transition:
        border-color 0.2s,
        box-shadow 0.2s,
        transform 0.2s;
}

.search-box:focus-within {
    border-color: #555;

    box-shadow:
        0 25px 80px rgba(0,0,0,0.65),
        0 0 35px rgba(255,255,255,0.04);
    
    transform: translateY(-1px);
}


.search-icon {
    width: 24px;
    margin-right: 10px;

    font-size: 20px;

    color: #777;
}


#searchInput {
    flex: 1;

    height: 100%;

    border: none;
    outline: none;

    background: transparent;

    color: white;

    font-size: 17px;
}

#searchInput::placeholder {
    color: #666;
}


.search-button {
    height: 48px;
    padding: 0 22px;

    border: none;
    border-radius: 25px;

    background: white;
    color: black;

    font-size: 14px;
    font-weight: 700;

    cursor: pointer;

    transition:
        transform 0.2s,
        opacity 0.2s;
}

.search-button:hover {
    transform: scale(1.03);
}

.search-button:active {
    transform: scale(0.97);
}


/* ============================= */
/* QUICK LINKS */
/* ============================= */

.quick-links {
    display: flex;
    flex-wrap: wrap;

    justify-content: center;

    gap: 10px;

    margin-top: 22px;
}

.quick-link {
    padding: 10px 16px;

    border: 1px solid #202020;

    border-radius: 20px;

    background: #0d0d0d;

    color: #aaa;

    font-size: 13px;

    cursor: pointer;

    transition:
        background 0.2s,
        color 0.2s,
        border-color 0.2s;
}

.quick-link:hover {
    background: #171717;
    color: white;
    border-color: #353535;
}


/* ============================= */
/* FOOTER */
/* ============================= */

.footer {
    position: absolute;

    bottom: 25px;

    color: #555;

    font-size: 12px;

    text-align: center;
}


/* ============================= */
/* MOBILE */
/* ============================= */

@media (max-width: 600px) {

    .logo {
        font-size: 55px;
    }

    .search-box {
        height: 58px;
        padding-left: 17px;
    }

    .search-button {
        height: 44px;
        padding: 0 17px;
    }

}

</style>
</head>


<body>


<div class="background">
    <div class="glow"></div>
</div>


<div class="main">


    <div class="logo">
        Femm
    </div>


    <div class="subtitle">
        Search the web, the Femm way.
    </div>


    <div class="search-wrapper">

        <div class="search-box">

            <div class="search-icon">
                ⌕
            </div>

            <input
                id="searchInput"
                type="text"
                placeholder="Search the web..."
                autocomplete="off"
            >

            <button
                class="search-button"
                id="searchButton"
            >
                Search
            </button>

        </div>


        <div class="quick-links">

            <button
                class="quick-link"
                onclick="quickSearch('YouTube')"
            >
                YouTube
            </button>

            <button
                class="quick-link"
                onclick="quickSearch('Google')"
            >
                Google
            </button>

            <button
                class="quick-link"
                onclick="quickSearch('Wikipedia')"
            >
                Wikipedia
            </button>

            <button
                class="quick-link"
                onclick="quickSearch('GitHub')"
            >
                GitHub
            </button>

        </div>

    </div>


    <div class="footer">
        Femm Search
    </div>

</div>


<script>


const searchInput =
    document.getElementById("searchInput");


const searchButton =
    document.getElementById("searchButton");


// =============================
// PERFORM SEARCH
// =============================

function performSearch() {

    const query =
        searchInput.value.trim();

    if (!query)
        return;

    /*
        For now this sends the search
        through the FemmBrowser backend.

        The next step will replace this
        with our own Femm Search results
        page.
    */

    if (
        window.femm &&
        typeof window.femm.navigate === "function"
    ) {

        const searchUrl =
            "file://" +
            window.location.pathname
                .replace(
                    /search\.html$/,
                    ""
                ) +
            "search.html?q=" +
            encodeURIComponent(query);

        window.femm.navigate(
            searchUrl
        );

    } else {

        const params =
            new URLSearchParams(
                window.location.search
            );

        params.set(
            "q",
            query
        );

        window.location.href =
            "search.html?" +
            params.toString();

    }

}


// =============================
// ENTER KEY
// =============================

searchInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            performSearch();
        }

    }
);


// =============================
// SEARCH BUTTON
// =============================

searchButton.addEventListener(
    "click",
    performSearch
);


// =============================
// QUICK SEARCH
// =============================

function quickSearch(text) {

    searchInput.value = text;

    performSearch();

}


// =============================
// AUTO-LOAD SEARCH
// =============================

const params =
    new URLSearchParams(
        window.location.search
    );

const existingQuery =
    params.get("q");

if (existingQuery) {

    searchInput.value =
        existingQuery;

}

</script>


</body>
</html>
